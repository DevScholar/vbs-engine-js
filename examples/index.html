    <script type="text/vbscript">
' ===== VBScript Section =====
Dim vbsMessage
vbsMessage = "Hello from VBS"

' Function to read JS variable
Function ReadJSMessage()
    On Error Resume Next
    ReadJSMessage = window.jsMessage
    If Err.Number <> 0 Then ReadJSMessage = "Read failed"
End Function

' Display result
Sub ShowResult()
    Dim displayResult, jsMsg
    jsMsg = ReadJSMessage()
    displayResult = "VBS reads JS: " & jsMsg & "<br>"
    displayResult = displayResult & "JS reads VBS: Waiting for JS display..." & "<br>"
    document.getElementById("demo-result").innerHTML = displayResult
End Sub

' Delayed execution to ensure JS is loaded
Sub Window_OnLoad()
    window.setTimeout "ShowResult()", 100, "VBScript"
    Call UpdateClock()
    timerID = window.setInterval("UpdateClock", 1000, "VBScript")
End Sub
</script>

    <script type="text/javascript">
        // ===== JavaScript Section =====
        var jsMessage = "Hello from JS";

        // Function to read VBS variable
        function readVBSMessage() {
            try {
                if (typeof vbsMessage !== 'undefined') {
                    return vbsMessage;
                }
                return "Read failed";
            } catch (e) {
                return "Read failed";
            }
        }

        // Display final result - poll until ShowResult has set the innerHTML
        function showFinalResult() {
            var resultDiv = document.getElementById("demo-result");
            var current = resultDiv.innerHTML;

            if (current.indexOf("Waiting for JS display...") >= 0) {
                var vbsMsg = readVBSMessage();
                resultDiv.innerHTML = current.replace("Waiting for JS display...", vbsMsg);
                clearInterval(pollTimer);
            }
        }

        // Poll every 100ms until VBS ShowResult has run and set the content
        var pollTimer = setInterval(showFinalResult, 100);

        // ===== Reporting a VBScript error =====
        // A VBScript failure reaches the page as a real JavaScript error, which is the shape IE's script error
        // reached it in, so `window.onerror` is where a page reports one.
        //
        // Where the script stopped is `line` and `column` on the error, which the engine fills from the statement
        // it failed on and counts within the script block it was handed, not within the document. IE reported
        // that position through the arguments of `window.onerror` rather than on the error object, and gave the
        // page no column at all, so a page that wants either reads them here. Those same `window.onerror`
        // arguments describe the JavaScript throw site, which for a VBScript failure is inside the engine.
        //
        // The stack needs no work from the page: the engine writes the head of it itself, in the reading
        // `cscript` prints, because `error.stack` is an ordinary writable property and belongs to that one error.
        // V8 does offer `Error.prepareStackTrace` for the same job, but it is a hook on the whole page and would
        // rewrite the stack of every other error the page reports. Firefox has no such hook and keeps its throw
        // position in the non-standard `lineNumber` and `columnNumber`, which are read only and say where
        // JavaScript threw rather than where the VBScript stopped.

        function codeText(number) {
            if (typeof number !== 'number') return '(not reported)';
            return '0x' + (number >>> 0).toString(16);
        }

        function positionText(error) {
            if (error && typeof error.line === 'number') {
                var column = typeof error.column === 'number' ? error.column : 0;
                return 'line ' + error.line + ', column ' + column;
            }
            if (error && typeof error.lineNumber === 'number') {
                return 'JavaScript line ' + error.lineNumber + ', column ' + (error.columnNumber || 0) + ' (Firefox)';
            }
            return 'not reported';
        }

        window.onerror = function (message, source, line, column, error) {
            var parts = [
                'Description:       ' + (error && error.description ? error.description : message),
                'Code:              ' + codeText(error && error.number),
                'VBScript position: ' + positionText(error),
                'JavaScript site:   ' + source + ':' + line + ':' + column,
                '',
                'Stack:',
                error && error.stack ? error.stack : '(not available)',
            ];
            document.getElementById('error-output').textContent = parts.join('\n');
            return false;
        };
    </script>

    <script type="text/vbscript">
Option Explicit

Dim timerID

' Main function: update clock display
Sub UpdateClock()
    Dim nowTime, hours, minutes, seconds, timeString
    nowTime = Now()

    hours = FormatTimePart(Hour(nowTime))
    minutes = FormatTimePart(Minute(nowTime))
    seconds = FormatTimePart(Second(nowTime))

    timeString = hours & ":" & minutes & ":" & seconds
    document.getElementById("clock").innerHTML = timeString
End Sub

' Helper function: format time part (zero-pad)
Function FormatTimePart(timePart)
    If Len(timePart) = 1 Then
        FormatTimePart = "0" & CStr(timePart)
    Else
        FormatTimePart = CStr(timePart)
    End If
End Function
